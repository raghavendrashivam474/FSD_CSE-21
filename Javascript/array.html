<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const car=["BMW","Volvo","Saab","Ford"];
        let text=" "; //null character
        for(let i=0;i<car.length;i+=2){
            text+=car[i]+"<br>";
        }
        document.write(text);
    </script>
</body>
</html>
