<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 0; i < 5; i++) {
            document.write("The value of i is: " + i + "<br>");
        }
        document.write("<br>");
        document.write("<br>");
        document.write("<br>");
        let n=1;
        while(n<=5){
            document.write("The value of n is: " + n + "<br>");
            n++;
        }
        document.write("<br>");
        document.write("<br>");
        document.write("<br>");
        let m=1;
        do {
            document.write("The value of m is: " + m + "<br>");
            m++;    
        }while(m<=5);
    </script>
</body>
</html>
